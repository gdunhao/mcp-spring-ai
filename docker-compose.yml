# ============================================================
# Docker Compose — Local Development Infrastructure
# ============================================================
# Starts Ollama (LLM backend) so you don't need to install it manually.
#
# Usage:
#   docker compose up -d          # Start Ollama in the background
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop and remove containers
# ============================================================

services:

  # ---------- Ollama (LLM backend) ----------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama   # Persist downloaded models between restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Model pull (runs once, then exits) ----------
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen3:0.6b} && echo '✅ Model ready'"
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

volumes:
  ollama-data:
    driver: local


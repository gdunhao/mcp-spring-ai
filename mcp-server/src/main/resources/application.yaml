# ============================================================
# MCP Server Configuration
# ============================================================
# This server exposes MCP capabilities (Tools, Resources, Prompts)
# over SSE (Server-Sent Events) transport by default.
#
# Transport modes:
#   SSE (default):  ./mvnw spring-boot:run -pl mcp-server
#   STDIO:          ./mvnw spring-boot:run -pl mcp-server -Dspring-boot.run.profiles=stdio
# ============================================================

spring:
  application:
    name: mcp-demo-server

  # --- Virtual Threads (Project Loom) ---
  # Enables virtual threads for all Spring MVC request handling,
  # providing massive throughput improvements with zero thread-pool tuning.
  threads:
    virtual:
      enabled: true

  # --- MCP Server settings ---
  ai:
    mcp:
      server:
        name: mcp-demo-server
        version: 1.0.0

  # --- H2 In-Memory Database (for Database Query Tool demo) ---
  datasource:
    url: jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # --- H2 Console (for debugging, accessible at /h2-console) ---
  h2:
    console:
      enabled: true
      path: /h2-console

# Server port for SSE transport
server:
  port: 3001

# Logging
logging:
  level:
    com.example.mcpserver: DEBUG
    org.springframework.ai.mcp: DEBUG

